name: releaser
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      suite_id:
        required: true
permissions:
  checks: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SUITE_ID: ${{ inputs.suite_id }}
        run: |
          a=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve")
          echo "::notice::L5B_APPROVE_STATUS=$a"
          r=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-suites/${SUITE_ID}/rerequest")
          echo "::notice::L5B_RERUN_STATUS=$r"
